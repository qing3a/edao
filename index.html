<!DOCTYPE html>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
            background: #0d0b11;
            color: #d8cdb4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 64px 24px;
        }

        .main {
            width: 100%;
            max-width: 560px;
            text-align: center;
        }

        /* 标题 */
        .title {
            font-family: 'Ma Shan Zheng', 'KaiTi', 'STKaiti', serif;
            font-weight: 400;
            font-size: clamp(52px, 9vw, 84px);
            letter-spacing: 0.18em;
            text-indent: 0.18em;
            color: #f0e7d3;
            line-height: 1.2;
        }

        /* 细分隔线 */
        .divider {
            width: 56px;
            height: 1px;
            margin: 30px auto 30px;
            background: linear-gradient(90deg, transparent, #c8a45c, transparent);
        }

        /* 引言 */
        .intro {
            font-size: 15.5px;
            line-height: 2.2;
            letter-spacing: 0.08em;
            color: #b3a88f;
        }
        .intro .red { color: #d97a5f; }

        /* 五术 · 克制列表 */
        .list {
            list-style: none;
            margin: 48px 0 8px;
        }
        .list li {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 14px;
            padding: 9px 0;
        }
        .list .num {
            font-family: 'Ma Shan Zheng', 'KaiTi', serif;
            font-size: 19px;
            color: #b03a2e;
            flex: none;
        }
        .list .name {
            font-size: 16px;
            letter-spacing: 0.14em;
            color: #e0d6bd;
        }
        .list .hint {
            font-size: 11px;
            letter-spacing: 0.04em;
            color: #7d7260;
            margin-top: 3px;
            display: block;
        }

        /* 结语 */
        .closing {
            margin: 44px 0 40px;
            font-size: 14px;
            line-height: 2.1;
            letter-spacing: 0.05em;
            color: #b3a88f;
        }
        .closing .strong {
            color: #d97a5f;
            font-size: 15px;
            font-weight: 600;
        }

        /* 入场按钮 */
        .cta {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-family: 'Noto Serif SC', serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.24em;
            text-indent: 0.24em;
            color: #f2e9d8;
            text-decoration: none;
            background: linear-gradient(180deg, #a93a2e, #8f2d24);
            border-radius: 4px;
            padding: 14px 40px;
            transition: 0.25s;
        }
        .cta:hover {
            background: linear-gradient(180deg, #bc4436, #9c332a);
            transform: translateY(-2px);
            box-shadow: 0 8px 26px rgba(143, 45, 36, 0.35);
        }
        .cta .arrow { font-size: 16px; letter-spacing: 0; }

        .foot {
            margin-top: 44px;
            font-size: 11px;
            letter-spacing: 0.16em;
            color: #5f5648;
        }

        @media (max-width: 640px) {
            body { padding: 48px 20px; }
            .list li { gap: 10px; }
        }
    </style>
</head>

        <ul class="list">
            <li><span class="num">壹</span><span class="name">情绪按钮<span class="hint">贪、嗔、痴</span></span></li>
            <li><span class="num">贰</span><span class="name">对立制造<span class="hint">敌化隔离</span></span></li>
            <li><span class="num">叁</span><span class="name">恶意归因<span class="hint">锁定罪人</span></span></li>
