<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="盗临天下——从叙事的角度，暴露恶、显现恶，让恶为人所知。拆解介入方挑拨关系、制造对立、恶意归因、从中渔利的叙事手法。">
    <title>盗临天下 · 让恶盗的手法无处藏身</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #faf6ec;
            --ink: #2a2620;
            --ink-2: #6f6553;
            --muted: #9b9080;
            --cinnabar: #b03a2e;
            --gold: #b08d4c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(176, 58, 46, 0.045), transparent 55%),
                var(--paper);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            line-height: 1.9;
            -webkit-font-smoothing: antialiased;
        }

        .page {
            width: 100%;
            max-width: 600px;
            text-align: center;
            animation: fade .8s ease both;
        }
        @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

        /* 标题 */
        .title {
            font-family: 'Ma Shan Zheng', 'KaiTi', serif;
            font-weight: 400;
            font-size: clamp(44px, 9vw, 64px);
            letter-spacing: 0.14em;
            text-indent: 0.14em;
            line-height: 1.2;
            color: var(--ink);
            margin-bottom: 26px;
        }

        /* 细分隔线 */
        .rule {
            width: 52px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 0 auto 30px;
        }

        /* 引言 */
        .intro {
            font-size: 15px;
            color: var(--ink-2);
            letter-spacing: 0.06em;
            margin-bottom: 52px;
        }
        .intro .red { color: var(--cinnabar); font-weight: 600; }

        /* 五术 · 一行一术 */
        .list {
            list-style: none;
            margin-bottom: 56px;
        }
        .list li {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 10px;
            padding: 7px 0;
        }
        .list .num {
            font-family: 'Ma Shan Zheng', 'KaiTi', serif;
            font-size: 18px;
            color: var(--cinnabar);
        }
        .list .name {
            font-size: 15.5px;
            letter-spacing: 0.1em;
            color: var(--ink);
        }
        .list .dot { color: var(--gold); font-size: 12px; }
        .list .hint { font-size: 12.5px; color: var(--muted); }

        /* 结语 */
        .closing {
            font-size: 14.5px;
            color: var(--ink-2);
            letter-spacing: 0.04em;
            margin-bottom: 42px;
        }
        .closing .strong {
            color: var(--cinnabar);
            font-weight: 700;
            font-size: 15px;
        }

        /* 按钮 */
        .cta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'Noto Serif SC', serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-indent: 0.2em;
            color: #fff9ee;
            text-decoration: none;
            background: linear-gradient(180deg, var(--cinnabar), #8f2d24);
            padding: 14px 40px;
            border-radius: 4px;
            transition: transform .2s, filter .2s;
        }
        .cta:hover { transform: translateY(-2px); filter: brightness(1.06); }
        .cta .arr { letter-spacing: 0; }

        .foot {
            margin-top: 44px;
            font-size: 11.5px;
            letter-spacing: 0.14em;
            color: var(--muted);
        }
        .foot b { font-weight: 400; }

        @media (max-width: 480px) {
            .list li { gap: 8px; }
            .list .name { letter-spacing: 0.04em; }
        }
    </style>
</head>
<body>
    <div class="page">
        <h1 class="title">盗临天下</h1>
        <div class="rule"></div>

        <p class="intro">从叙事的角度，暴露恶、显现恶，<span class="red">让恶为人所知</span>。</p>

        <ul class="list">
            <li><span class="num">壹</span><span class="name">情绪按钮</span><span class="dot">·</span><span class="hint">贪嗔痴</span></li>
            <li><span class="num">贰</span><span class="name">对立制造</span><span class="dot">·</span><span class="hint">敌化隔离</span></li>
            <li><span class="num">叁</span><span class="name">恶意归因</span><span class="dot">·</span><span class="hint">锁定罪人</span></li>
            <li><span class="num">肆</span><span class="name">留白漏斗</span><span class="dot">·</span><span class="hint">扣住答案</span></li>
            <li><span class="num">伍</span><span class="name">审核规避</span><span class="dot">·</span><span class="hint">概念替换</span></li>
        </ul>

        <p class="closing">手法一旦被完整写出并公开，就再也藏不住。<br><span class="strong">认得出来，就不再是猎物。</span></p>

        <a class="cta" href="https://github.com/qing3a/edao" target="_blank" rel="noopener">前往 GitHub 仓库<span class="arr">→</span></a>

        <div class="foot"><b>纯前端</b> · <b>无构建</b> · 数据与逻辑完全开源</div>
    </div>
</body>
</html>
